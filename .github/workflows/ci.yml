name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: pwa/dist

  daemon-linux:
    # Logique multiplateforme (FSM, protocole, PKI, auth, ONNX…) ; la capture micro est propre à Windows.
    needs: pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: pwa/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - run: cargo test --no-default-features --features onnx
        working-directory: daemon

  daemon-windows:
    needs: pwa
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: pwa/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: LLVM (bindgen whisper.cpp)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Vérification des prérequis (scripts/build-windows.ps1 -CheckOnly)
        shell: pwsh
        run: .\scripts\build-windows.ps1 -CheckOnly -NoInstaller
      - name: Tests
        run: cargo test --release
        working-directory: daemon
      - name: Build
        run: cargo build --release
        working-directory: daemon
      - name: Smoke test (démarrage + API locale)
        shell: pwsh
        run: |
          $env:DUMONVOICE_HOME = "$env:RUNNER_TEMP\dvhome"
          $p = Start-Process -FilePath daemon\target\release\dumonvoice.exe -ArgumentList '--background' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18450/ ; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          $code = 0
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18450/api/status | Out-Null } catch { $code = $_.Exception.Response.StatusCode.value__ }
          Get-Content "$env:DUMONVOICE_HOME\logs\*" -ErrorAction SilentlyContinue | Select-Object -Last 40
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Le daemon n'a pas servi la PWA" }
          if ($code -ne 401) { throw "L'API devrait exiger une authentification (code $code)" }
      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path daemon\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\dumonvoice.iss
      - uses: actions/upload-artifact@v4
        with:
          name: dumonvoice-windows
          path: |
            daemon/target/release/dumonvoice.exe
            installer/Output/*.exe
