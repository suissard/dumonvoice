[package]
name = "dumonvoice"
version = "0.1.0"
edition = "2021"
description = "Dictée vocale universelle 100 % locale pour Windows, avec compagnon mobile PWA"
license = "MIT"
publish = false

[lib]
name = "dumonvoice"
path = "src/lib.rs"

[[bin]]
name = "dumonvoice"
path = "src/main.rs"

[features]
default = ["whisper", "onnx"]
# Moteur Whisper intégré (whisper.cpp via whisper-rs). Nécessite CMake + LLVM/Clang au build.
whisper = ["dep:whisper-rs"]
whisper-cuda = ["whisper", "whisper-rs/cuda"]
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
# Silero VAD + OpenWakeWord via ONNX Runtime.
onnx = ["dep:ort"]

[dependencies]
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = "0.13"
time = "0.3"
mdns-sd = "0.11"
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
if-addrs = "0.13"
gethostname = "0.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
parking_lot = "0.12"
cpal = "0.15"
whisper-rs = { version = "0.13", optional = true }
ort = { version = "=2.0.0-rc.9", optional = true }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
winreg = "0.52"
windows = { version = "=0.58.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
